<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - NexoStock</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>NexoStock</h1>
        <p>Gestión de productos</p>
    </header>

    <nav aria-label="Navegación principal">
        <ul>
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="login.html">Cerrar sesión</a></li>
        </ul>
    </nav>


    <main>

        <section>
            <h2>Buscar productos</h2>

            <label for="buscador">Buscar:</label>
            <input type="search" id="buscador" name="buscador" placeholder="Buscar por nombre o categoría">
        </section>

        <section>
            <h2>Productos registrados</h2>

            <div class="tabla-resumen">
                <table>
                    <caption>Lista de productos registrados en NexoStock</caption>

                    <thead>
                        <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Stock</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaProductos">
                        <!-- Las filas se generan con JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>Registrar producto</h2>

            <form id="formProducto" novalidate>

                <p>
                    <label for="codigo">Código:</label>
                    <input type="text" id="codigo" name="codigo" required>
                </p>

                <p>
                    <label for="nombre">Nombre del producto:</label>
                    <input type="text" id="nombre" name="nombre" required minlength="3" aria-describedby="errorNombre">
                    <span id="errorNombre" class="mensaje-error"></span>
                </p>

                <p>
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria" required aria-describedby="errorCategoria">
                        <option value="">Selecciona una categoría</option>
                        <option value="Granos">Granos</option>
                        <option value="Despensa">Despensa</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Aseo">Aseo</option>
                        <option value="Papelería">Papelería</option>
                    </select>
                    <span id="errorCategoria" class="mensaje-error"></span>
                </p>

                <p>
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" name="precio" min="0.01" required aria-describedby="errorPrecio">
                    <span id="errorPrecio" class="mensaje-error"></span>
                </p>

                <p>
                    <label for="stock">Cantidad en stock:</label>
                    <input type="number" id="stock" name="stock" min="0" step="1" required
                        aria-describedby="errorStock">
                    <span id="errorStock" class="mensaje-error"></span>
                </p>

                <button type="submit">Registrar producto</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 NexoStock</p>
    </footer>
<script src="js/datos-prueba.js"></script>
<script src="js/ejercicios.js"></script>
</body>

</html>
